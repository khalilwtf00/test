openapi: 3.0.0
info:
  title: Book Store API
  description: A simple API to manage a book store
  version: 1.0.0
servers:
  - url: https://api.example.com/v1
    description: Production server
  - url: http://localhost:8080/v1
    description: Development server

paths:
  /books:
    get:
      summary: Get all books
      description: Returns a list of all books in the store
      responses:
        '200':
          description: A list of books
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Book'
    post:
      summary: Add a new book
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Book'
      responses:
        '201':
          description: Book created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'

  /books/{id}:
    get:
      summary: Get a book by ID
      parameters:
        - name: id
          in: path
          required: true
          description: ID of the book to retrieve
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Book found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'
        '404':
          description: Book not found

components:
  schemas:
    Book:
      type: object
      required:
        - title
        - author
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
          description: Auto-generated book ID
        title:
          type: string
          description: Title of the book
          example: The Great Gatsby
        author:
          type: string
          description: Author of the book
          example: F. Scott Fitzgerald
        publishedYear:
          type: integer
          description: Year the book was published
          example: 1925
        genre:
          type: string
          description: Genre of the book
          example: Classic
